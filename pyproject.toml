[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dark-factory"
version = "0.1.0"
description = "Software Dark Factory MVP: agent pipeline that turns tasks into working, tested code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx2>=2.12",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "psycopg>=3.2",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=2.43.0",
    "pydantic-graph>=2.43,<3",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
factory = "dark_factory.runtime.entrypoint:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dark_factory"]

[tool.hatch.build.targets.sdist]
include = ["src/dark_factory", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# docs/ and specs/ are prose with illustrative snippets; formatting their code blocks
# is not part of the pipeline.
extend-exclude = ["docs", "specs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations inline long CHECK constraint literals.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# packs/ holds product-repository templates (data, own toolchain) - factory
# mypy must not crawl them (`mypy .` in CI would hit duplicate module names,
# e.g. two Alembic env.py).
exclude = ["^packs/"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
