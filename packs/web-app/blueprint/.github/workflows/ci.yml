# CI of the example product (web-app engineering pack blueprint, T-070).
#
# A self-contained product workflow: gates per stack, then trusted image
# builds — the simplified single-file shape of the factory pair
# (.github/workflows/ci.yml + factory-image.yml/console-image.yml), without
# the reusable-workflow mechanics.
#
# Contract (mirrors the factory, ADR-019/ADR-011):
#   - every checkout is pinned to the final SHA of the change
#     (github.event.pull_request.head.sha || github.sha, FR-009 pattern);
#   - gates: backend ruff/mypy/pytest (integration tests against a real
#     PostgreSQL service), frontend eslint/tsc/vitest;
#   - images build on every run (a broken Dockerfile can never slip past an
#     MR) but publish ONLY from main, ONLY the immutable tag `sha-<sha>` to
#     ghcr.io — never `latest`, never a floating tag; promotion between
#     environments happens by digest via a GitOps MR;
#   - image jobs are the only holders of `packages: write` (trusted tier);
#   - secrets scan (gitleaks) and fail-closed trivy scans guard the build;
#   - digest evidence is uploaded as an artifact for the GitOps MR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Adapt the org/repo names when creating a real product from the blueprint.
  BACKEND_IMAGE: ghcr.io/example-org/example-product-backend
  FRONTEND_IMAGE: ghcr.io/example-org/example-product-frontend

jobs:
  backend-lint:
    name: Backend ruff lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Gates re-run on the final SHA of the change (FR-009 pattern).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  backend-typecheck:
    name: Backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy typecheck
        run: uv run mypy

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: example_product_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d example_product_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL integration tests; without it they skip.
      APP_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:55432/example_product_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  frontend-typecheck:
    name: Frontend tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  frontend-test:
    name: Frontend vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests (vitest)
        run: npm run test

  # Small UIKit gates (packs/ui, ADR-014): the vendored @small/ui workspace
  # package carries its own lint (ESLint UIKit-policy + stylelint), typecheck,
  # vitest (components + axe a11y + tokens drift), gate self-test (fixtures:
  # violations are blocked, clean code passes) and the Storybook build (the
  # executable UI spec). The visual regression gate is NOT run here: it is
  # owned by the factory CI in the pinned Playwright container (packs/ui
  # rules.md determinism contract).
  frontend-ui-gates:
    name: Frontend UI kit gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: UI kit lint (ESLint policy + stylelint)
        run: npm run ui:lint

      - name: UI kit typecheck
        run: npm run ui:typecheck

      - name: UI kit tests (vitest)
        run: npm run ui:test

      - name: UI kit gate self-test
        run: npm run ui:gates

      - name: UI kit Storybook build
        run: npm run ui:storybook:build

  # Trusted backend image build (factory-image pattern, simplified): gates
  # first, multi-arch, immutable sha-<sha> tag, publish only from main.
  image-backend:
    name: Backend OCI image
    needs: [backend-lint, backend-typecheck, backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TAG: sha-${{ github.event.pull_request.head.sha || github.sha }}
      # Fork PRs and non-main branches build (Dockerfile validation) but never
      # publish: publication is a main-only act (ADR-011 merge policy).
      CAN_PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Secrets scan (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --exit-code 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: deploy/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: ${{ env.CAN_PUSH }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}

      - name: Image vulnerability scan (trivy, fail-closed)
        if: env.CAN_PUSH == 'true'
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "scanning $platform"
            docker run --rm \
              -v /home/runner/.docker/config.json:/tmp/docker/config.json:ro \
              -e DOCKER_CONFIG=/tmp/docker \
              ghcr.io/aquasecurity/trivy:0.68.1@sha256:a93fd67162843c0f749002af9245fe9a2e5edc41445bd71d3949c803e95ef05b \
              image \
                --platform "$platform" \
                --ignore-unfixed \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --format json \
                "${BACKEND_IMAGE}@${{ steps.build.outputs.digest }}" \
                > "trivy-backend-$(echo "$platform" | tr / -).json"
          done

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-evidence-${{ env.SHA }}-${{ github.run_id }}
          path: trivy-backend-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Record digest for the GitOps MR
        if: env.CAN_PUSH == 'true'
        run: |
          echo "backend image: ${BACKEND_IMAGE}@${{ steps.build.outputs.digest }} (tag $TAG)"
          echo "backend_tag=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "backend_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # Trusted frontend image build: bundle dist/ is built here on the pinned
  # Node (frontend/.nvmrc), then copied into the nginx image.
  image-frontend:
    name: Frontend OCI image
    needs: [frontend-lint, frontend-typecheck, frontend-test, frontend-ui-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TAG: sha-${{ github.event.pull_request.head.sha || github.sha }}
      CAN_PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Secrets scan (gitleaks)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --exit-code 1

      - name: Build frontend bundle (dist/)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: ${{ env.CAN_PUSH }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}

      - name: Image vulnerability scan (trivy, fail-closed)
        if: env.CAN_PUSH == 'true'
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "scanning $platform"
            docker run --rm \
              -v /home/runner/.docker/config.json:/tmp/docker/config.json:ro \
              -e DOCKER_CONFIG=/tmp/docker \
              ghcr.io/aquasecurity/trivy:0.68.1@sha256:a93fd67162843c0f749002af9245fe9a2e5edc41445bd71d3949c803e95ef05b \
              image \
                --platform "$platform" \
                --ignore-unfixed \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --format json \
                "${FRONTEND_IMAGE}@${{ steps.build.outputs.digest }}" \
                > "trivy-frontend-$(echo "$platform" | tr / -).json"
          done

      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-evidence-${{ env.SHA }}-${{ github.run_id }}
          path: trivy-frontend-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Record digest for the GitOps MR
        if: env.CAN_PUSH == 'true'
        run: |
          echo "frontend image: ${FRONTEND_IMAGE}@${{ steps.build.outputs.digest }} (tag $TAG)"
          echo "frontend_tag=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "frontend_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
