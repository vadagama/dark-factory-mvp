{{- if .Values.migrations.enabled }}
{{- /* Schema migrations as a post-install/post-upgrade hook Job (factory chart
pattern). POST phases only, no pre-*: Argo CD maps helm.sh/hook pre-install
and pre-upgrade to its PreSync phase, which runs BEFORE the chart's own
resources are applied - so a pre-* hook cannot reach the in-chart
PostgreSQL on the very first release (first-install deadlock, observed in
the T043 pilot: "failed to resolve host <release>-postgres"). With
post-install/post-upgrade the resources (postgres, backend, frontend)
are applied first, then the hook runs and its wait-for-database retry
absorbs first-boot initdb latency. A failed install/PostSync keeps its
resources, so the next Argo/helm attempt runs the Job against a live
database (convergent). Consequence: on upgrades migrations run AFTER the
new backend is deployed - schema changes must be backward-compatible
(expand/contract). The command wraps the migrations entrypoint in a retry
because first-boot postgres initdb takes longer than the Service DNS
record to appear. The backend image ships alembic and migrations/; the
DATABASE_URL secret must exist before the release is applied. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "web-app.fullname" . }}-migrations
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "web-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: "{{ .Values.backend.image.repository }}@{{ .Values.backend.image.digest }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          # sh -c 'script' arg0 args...: inside the script $0 is arg0 and
          # "$@" are the remaining args, so migrations-wrapper is a placeholder
          # and the values.migrations.command elements run verbatim. 30 tries
          # x 5s sleep ~ 150s of waiting, within activeDeadlineSeconds: 300.
          command:
            - sh
            - -c
            - |
              i=0
              until "$@"; do
                i=$((i+1))
                if [ "$i" -ge 30 ]; then
                  echo "migrations: giving up after $i attempts" >&2
                  exit 1
                fi
                echo "migrations: attempt $i failed (database not ready?), retrying in 5s" >&2
                sleep 5
              done
            - migrations-wrapper
            {{- range .Values.migrations.command }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.existingSecret }}
                  key: {{ .Values.backend.database.secretKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
