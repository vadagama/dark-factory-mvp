name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deterministic machine checks (T025, docs T-031): build/test/lint/security
  # run as separate jobs so a failure is attributable to one check. Every
  # checkout is pinned to the final SHA of the change, so the gates always
  # re-run on the same commit the agents finished on (FR-009, SC-004).
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Gates re-run on the final SHA of the change (FR-009, SC-004).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Mypy typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy typecheck
        run: uv run mypy .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dark_factory_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d dark_factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL integration tests (ADR-004, T-006); without it they skip.
      DARK_FACTORY_TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:55432/dark_factory_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Audit locked dependencies with pip-audit
        # Audits the resolved dependency set from uv.lock; pip-audit comes
        # from uvx at runtime — no new pyproject dependencies.
        run: |
          uv export --frozen --no-emit-project --no-dev > pip-audit-requirements.txt
          uvx pip-audit -r pip-audit-requirements.txt

  factory-us1-parity:
    name: US1 walking skeleton (doctor + stage run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Factory doctor
        run: |
          set +e
          uv run factory doctor --json > doctor.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "factory doctor exited with code $code" >&2
            cat doctor.json >&2
            exit "$code"
          fi
          uv run python - <<'PY'
          import json

          report = json.load(open("doctor.json"))
          summary = report["summary"]
          assert summary["error"] == 0, summary
          assert summary["status"] in {"ok", "warn"}, summary
          print(f"doctor ok: status={summary['status']} error={summary['error']}")
          PY

      - name: Factory stage run (US1 scenario 2 parity)
        run: |
          set +e
          uv run factory stage run --change ./fixtures/chg_smoke.yaml --stage construction --json --non-interactive > stage_result.json
          code=$?
          set -e
          # waiting (10) is a contract outcome, not an error (cli.md): the result is
          # persisted before the external wait and the job ends without blocking a runner.
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            echo "factory stage run exited with code $code" >&2
            cat stage_result.json >&2
            exit "$code"
          fi
          uv run python - <<'PY'
          import json

          result = json.load(open("stage_result.json"))
          assert result["schema_version"] == 1, result
          assert result["status"] in {"waiting", "succeeded"}, result
          assert result["change_id"] == "chg_smoke", result
          assert isinstance(result["next_action"]["type"], str), result
          assert result["next_action"]["type"], result
          print(
              f"stage run ok: status={result['status']}"
              f" change_id={result['change_id']}"
              f" next_action={result['next_action']['type']}"
          )
          PY

  # Dogfooding (T025): every MR exercises the reusable stage-job template on
  # the smoke change, so the factory CI contract stays green by construction.
  factory-stage-smoke:
    name: Factory stage template (construction on chg_smoke)
    uses: ./.github/workflows/factory-stage.yml
    with:
      change: ./fixtures/chg_smoke.yaml
      stage: construction

  # Trusted OCI image build (T033, docs T-044): only of a fully green final
  # SHA (deployment.md §8). Publishes the immutable sha-<sha> tag to ghcr.io
  # and produces scan/SBOM/digest evidence. Never carries merge/deploy
  # credentials (packages: write only, ADR-011/ADR-019).
  #
  # The calling job MUST grant what the callee requests: factory-image.yml
  # declares `packages: write`, and a caller that does not grant it makes
  # GitHub reject the whole run at startup (no jobs, no logs) — the T-044
  # incident that kept every ci.yml run from starting.
  factory-image:
    name: Factory OCI image (trusted build)
    needs: [lint, typecheck, test, build, security, factory-us1-parity, factory-stage-smoke]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/factory-image.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}

  # Console gates (T036, ADR-021 p.6): the console subproject runs its own
  # machine checks on the pinned Node (console/.nvmrc), mirroring the Python
  # gates above. Checkouts are pinned to the final SHA of the change.
  console-lint:
    name: Console ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  console-typecheck:
    name: Console tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  console-test:
    name: Console vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests (vitest)
        run: npm run test

  console-build:
    name: Console build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  console-e2e:
    name: Console Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite (vite preview + synthetic API)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-playwright-report-${{ github.run_id }}
          path: console/playwright-report
          retention-days: 14
          if-no-files-found: warn

  # Small UIKit gates (T042, ADR-014): the kit runs its own machine checks on
  # the pinned Node (packs/ui/blueprint/ui/.nvmrc), mirroring the console jobs
  # above. Checkouts are pinned to the final SHA of the change. The uikit-*
  # jobs are independent of the trusted image builds and are NOT part of their
  # needs chains.
  uikit-lint:
    name: UIKit ESLint + stylelint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packs/ui/blueprint/ui/.nvmrc
          cache: npm
          cache-dependency-path: packs/ui/blueprint/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (kit + product policy) and stylelint (token discipline)
        run: npm run lint

  uikit-typecheck:
    name: UIKit tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packs/ui/blueprint/ui/.nvmrc
          cache: npm
          cache-dependency-path: packs/ui/blueprint/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

  uikit-test:
    name: UIKit vitest (components + axe + tokens)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packs/ui/blueprint/ui/.nvmrc
          cache: npm
          cache-dependency-path: packs/ui/blueprint/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit, a11y and tokens tests (vitest)
        run: npm run test

  uikit-gates:
    name: UIKit gate self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packs/ui/blueprint/ui/.nvmrc
          cache: npm
          cache-dependency-path: packs/ui/blueprint/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Gate self-test (violations are blocked, clean code passes)
        run: npm run test:gates

  # Storybook is the executable UI spec (ADR-014 p.2): the DoD requires it to
  # build in CI as an artifact of the factory pipeline.
  uikit-storybook:
    name: UIKit Storybook build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: packs/ui/blueprint/ui/.nvmrc
          cache: npm
          cache-dependency-path: packs/ui/blueprint/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook (executable UI spec)
        run: npm run storybook:build

  # Visual regression in the pinned browser container (packs/ui/rules.md):
  # the container tag equals @playwright/test in package-lock.json; the
  # orchestrator pins the digest. Baselines are committed and updated only via
  # review. Red until the baselines land in the repository — expected for the
  # first runs after the kit is introduced.
  uikit-visual:
    name: UIKit visual regression (pinned browser)
    runs-on: ubuntu-latest
    # Tag = @playwright/test version (package-lock.json); digest pinning is
    # added by the orchestrator (factory-image pattern).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: packs/ui/blueprint/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: npm ci

      - name: Visual regression over every Storybook story
        run: npm run test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uikit-visual-report-${{ github.run_id }}
          path: packs/ui/blueprint/ui/playwright-report
          retention-days: 14
          if-no-files-found: warn

  # Trusted console OCI image build (T036, ADR-021 p.7): only of a fully
  # green final SHA (factory-image pattern). Publishes the immutable sha-<sha>
  # tag to ghcr.io/vadagama/dark-factory-console with scan/SBOM/digest
  # evidence; packages: write only (ADR-011/ADR-019).
  #
  # Same caller-side grant as factory-image above: the callee declares
  # `packages: write`, so the calling job must grant it.
  console-image:
    name: Console OCI image (trusted build)
    needs: [lint, typecheck, test, build, security, factory-us1-parity, factory-stage-smoke, console-lint, console-typecheck, console-test, console-build, console-e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/console-image.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
