{{- if .Values.serviceAccount.create }}
{{- /* Opt-in only: by default the chart reuses the bootstrap SA of ns
`factory` (deploy/bootstrap/manifests/serviceaccounts.yaml). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "dark-factory.fullname" .) .Values.serviceAccount.name }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
automountServiceAccountToken: false
{{- end }}
