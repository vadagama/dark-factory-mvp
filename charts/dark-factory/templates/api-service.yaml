apiVersion: v1
kind: Service
metadata:
  name: {{ include "dark-factory.fullname" . }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dark-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
