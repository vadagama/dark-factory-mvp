apiVersion: v1
kind: Service
metadata:
  name: {{ include "dark-factory.fullname" . }}-console
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dark-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: console
