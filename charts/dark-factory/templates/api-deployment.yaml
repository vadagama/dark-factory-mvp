apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dark-factory.fullname" . }}
  labels:
    {{- include "dark-factory.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: {{ .Values.api.strategy }}
  selector:
    matchLabels:
      {{- include "dark-factory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dark-factory.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "dark-factory.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The CLI defaults to 127.0.0.1 — inside a container the bind host
          # must be 0.0.0.0 for the probes and the Service to reach it.
          command: ["factory", "api", "serve"]
          args:
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.api.port | quote }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            {{- if .Values.auth.existingSecret }}
            - name: DARK_FACTORY_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            {{- end }}
            {{- if .Values.ciToggles.existingSecret }}
            # CI stage toggles (T059, ADR-027): the repository whose variables
            # the console switches. The GitHub App credentials arrive through
            # the secretRef below.
            - name: DARK_FACTORY_GITHUB_REPOSITORY_SLUG
              value: {{ required "ciToggles.repositorySlug is required when ciToggles.existingSecret is set" .Values.ciToggles.repositorySlug | quote }}
            {{- end }}
          {{- if .Values.ciToggles.existingSecret }}
          envFrom:
            # Same convention as the runner (deploy/ci/manifests/
            # runner-deployment.yaml): credentials created OUTSIDE git, and
            # optional: true keeps the pod startable without the secret — the
            # /ci endpoints then report themselves unconfigured (fail-closed).
            - secretRef:
                name: {{ .Values.ciToggles.existingSecret }}
                optional: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
