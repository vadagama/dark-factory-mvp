# Outbox Dispatcher CronJob (T028, ADR-016 p.4): the single owner of outbox
# delivery. Every 2 minutes it runs `factory outbox dispatch --cleanup` —
# one delivery pass (FOR UPDATE SKIP LOCKED + short lease, ordering per
# aggregate, exponential backoff, dead-letter) plus the retention cleanup
# step (ADR-016 p.9). `concurrencyPolicy: Forbid` is only an optimisation:
# correctness comes from the SKIP LOCKED reservation, not from the policy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: factory-outbox-dispatcher
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: outbox-dispatcher
    app.kubernetes.io/component: events
    app.kubernetes.io/managed-by: dark-factory
spec:
  schedule: "*/2 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One pass must comfortably finish within the 2-minute schedule; a
      # stuck job is cut off and its leased deliveries are retried next pass.
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: dark-factory
            app.kubernetes.io/name: outbox-dispatcher
            app.kubernetes.io/component: events
            app.kubernetes.io/managed-by: dark-factory
        spec:
          restartPolicy: OnFailure
          # Bootstrap service account of the factory namespace
          # (deploy/bootstrap/manifests/serviceaccounts.yaml); a dedicated
          # dispatcher SA with narrowed RBAC arrives with T030/T042.
          serviceAccountName: factory-api
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: outbox-dispatcher
              # PLACEHOLDER image: the real image is built as an immutable
              # digest in T033 (OCI build job) and delivered through the Helm
              # chart in T042; until then bootstrap uses this tag.
              image: ghcr.io/vadagama/dark-factory:bootstrap
              imagePullPolicy: IfNotPresent
              command: ["factory", "outbox", "dispatch", "--cleanup"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      # PLACEHOLDER secret (created outside git, see README):
                      #   kubectl -n factory create secret generic \
                      #     factory-outbox-dispatcher-database \
                      #     --from-literal=DATABASE_URL='postgresql+psycopg://...'
                      name: factory-outbox-dispatcher-database
                      key: DATABASE_URL
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
