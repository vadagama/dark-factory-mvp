{{/* Pilot workload desired state (T032 fixture): a digest-pinned, hardened */}}
{{/* no-op deployment in apps-dev — the target of the GitOps MR digest change. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: dark-factory-gitops
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/part-of: dark-factory
        app.kubernetes.io/managed-by: dark-factory-gitops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          # Digest-pinned image — a tag would violate the repository rules
          # (README.md) and break revert-based rollback (ADR-010 п.1).
          image: "{{ .Values.image.repository }}@{{ required "image.digest must be an immutable digest (ADR-015 п.5)" .Values.image.digest }}"
          command: {{ toJson .Values.command }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
