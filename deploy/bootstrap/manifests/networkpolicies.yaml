# Intra-namespace traffic: a bare podSelector peer selects all pods of the
# policy's own namespace, in both directions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-ns
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
