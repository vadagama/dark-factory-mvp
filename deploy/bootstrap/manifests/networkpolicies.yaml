---
# DNS: CoreDNS pods in kube-system (label k8s-app=kube-dns), UDP and TCP 53
# (TCP is needed for large/truncated responses).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
