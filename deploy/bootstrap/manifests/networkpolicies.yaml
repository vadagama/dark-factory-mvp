# External HTTPS egress (TCP 443): GitHub API (factory reconciler / GitHub App),
# LLM APIs and GitHub (agent jobs in factory-runs), GitHub Actions queue and
# registries (ci), git/Helm repositories (argocd). apps-dev gets none by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
