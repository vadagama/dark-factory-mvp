# Baseline NetworkPolicy for the dark factory local environment (T029, ADR-010).
#
# Model: default deny (all ingress + egress) in every platform namespace, with
# explicit allows below:
#   - allow-dns          CoreDNS (kube-system, UDP/TCP 53) — required to resolve
#                        any name, including cluster-internal services.
#   - allow-intra-ns     pod-to-pod inside the same namespace: factory API ->
#                        factory PostgreSQL, backup CronJob -> PostgreSQL,
#                        restore-test -> PostgreSQL, agent job coordination.
#   - allow-egress-https outbound TCP 443 only for namespaces that must reach
#                        external services: GitHub API (reconciler / GitHub App /
#                        CI queue), LLM APIs (agent jobs), git/Helm repos
#                        (Argo CD). Kept broad (0.0.0.0/0) for the MVP; T030
#                        narrows it to explicit endpoints.
#   - apps-dev has intentionally NO external egress in the baseline: deployed
#     apps must declare their own policies (T030/T031+).
# Blocked by design: plain HTTP 80, SMTP 25 and everything else not allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
