# Resource quotas and limit ranges for the platform namespaces (T029, ADR-010).
# Profile: single-node Docker Desktop with 10-12GB for the whole VM and
# concurrency=1. Limit sums (~12.5Gi total) are ceilings per namespace; the
# actual peak with concurrency=1 stays well below (verified by
# scripts/capacity-smoke.sh).
# LimitRange defaults are required: a ResourceQuota that constrains limits
# rejects pods without explicit resources, so defaults keep untyped pods usable.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: factory-quota
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: factory-defaults
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/managed-by: bootstrap
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 25m
        memory: 32Mi
---
apiVersion: v1
kind: ResourceQuota
