# Factory PostgreSQL (T029). One StatefulSet hosting two logically separated
# databases: `factory` (owner: factory) and `plane` (owner: plane). Database
# credentials are generated by bootstrap.sh into the factory-postgres-credentials
# secret on first run and never committed to git.
# Image note (ADR-010): postgres:16.4 is multi-arch and runs on arm64.
apiVersion: v1
kind: Service
metadata:
  name: factory-postgres
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: bootstrap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: v1
kind: Service
metadata:
  name: factory-postgres-headless
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: bootstrap
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-postgres-init
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: bootstrap
data:
  01-init-databases.sh: |
    #!/bin/bash
    # Creates the two logically separated databases and their owner roles.
    # Runs once on first initialization of an empty data directory.
    # Passwords come from the secret; base64 output never contains quotes,
    # so single-quoted SQL literals are safe.
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER:-postgres}" --dbname postgres <<SQL
    CREATE ROLE factory LOGIN PASSWORD '${FACTORY_DB_PASSWORD}';
    CREATE ROLE plane LOGIN PASSWORD '${PLANE_DB_PASSWORD}';
    CREATE DATABASE factory OWNER factory;
    CREATE DATABASE plane OWNER plane;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-postgres-backups
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: backup-storage
    app.kubernetes.io/managed-by: bootstrap
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: factory-postgres
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: bootstrap
spec:
  serviceName: factory-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dark-factory
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: bootstrap
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: FACTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory-postgres-credentials
                  key: FACTORY_DB_PASSWORD
            - name: PLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: factory-postgres-credentials
                  key: PLANE_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: factory-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: dark-factory
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: bootstrap
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
