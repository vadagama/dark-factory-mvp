# Service accounts for the factory platform (T029). Token automount is
# disabled by default; T030 binds narrowly scoped roles where a workload
# actually needs API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-api
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: factory-api
    app.kubernetes.io/managed-by: bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-reconciler
  namespace: factory
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: factory-reconciler
    app.kubernetes.io/managed-by: bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-ci
  namespace: ci
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: factory-ci
    app.kubernetes.io/managed-by: bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-agent
  namespace: factory-runs
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: factory-agent
    app.kubernetes.io/managed-by: bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apps-deployer
  namespace: apps-dev
  labels:
    app.kubernetes.io/part-of: dark-factory
    app.kubernetes.io/name: apps-deployer
    app.kubernetes.io/managed-by: bootstrap
automountServiceAccountToken: false
